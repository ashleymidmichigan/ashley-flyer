  • To change a promotion: edit its name / price / category / image.
  • "name" is the card title. For a verified series, put the series in "name" and the product descriptor in "desc".
  • To add one: copy a line, put the new picture in the img/ folder.
    "image" = picture on the card, "large" = bigger version when tapped
    (leave "large" out to reuse "image").
  • "category" must match one of the names in "categories".
  • Optional "terms": the financing line printed on that flyer. Keep each flyer's own percent. Do not copy a furniture percent onto Mattresses or Bedding.
  • Leave "desc" off when it would repeat "name". Do not add an unverified series.
  • Several sizes? Use "prices": [ {"label":"Queen","price":"$749"}, ... ] instead of "price".
  • No price? Leave "price" out and add "badge": "your text" instead.
  • Sale dates: type them into "dates" (e.g. "Oct 1 – Oct 31"); leave "" to hide.
  • Leave a store "phone" as "" to hide its call link.
  Keep the commas and quotes exactly as they are.
  ===================================================================== -->

<style>
  :root{--ink:#161616;--muted:#4e4e4e;--paper:#f3f3f4;--sand:#e8e8ea;--gold:#e2b340;--gold-ink:#7a5c12;--red:#c41230;--charcoal:#141414;
        --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.06)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto}
  :focus-visible{outline:3px solid var(--gold-ink);outline-offset:2px}

  header{position:relative;overflow:hidden;color:#fff;text-align:center;padding:28px 20px 24px;
    background:radial-gradient(80% 90% at 100% 0%,rgba(226,179,64,.28) 0%,rgba(226,179,64,0) 58%),linear-gradient(180deg,#1c1c1c,#101010);
    border-top:4px solid var(--gold)}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .brand svg{width:22px;height:22px}
  h1{margin:10px 0 0;font-weight:900;font-size:clamp(40px,12vw,72px);line-height:.92;letter-spacing:-.03em;text-transform:uppercase;color:#fff}
  header .tag{margin:12px auto 0;max-width:28em;font-weight:600;font-size:16px;line-height:1.35;color:#f2f2f2}
  .dates{display:inline-block;margin-top:14px;padding:7px 16px;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.06)}
  .fin{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--gold);color:var(--charcoal);text-align:center;font-weight:800;font-size:14px;line-height:1.35;padding:12px 16px}
  .fin-copy{max-width:40em}
  .apply{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;background:var(--charcoal);color:#fff;font:inherit;font-weight:800;font-size:14px;letter-spacing:.04em;text-decoration:none;border:2px solid var(--charcoal);border-radius:999px}
  .apply:hover{background:#fff;color:var(--charcoal)}
  .apply:focus-visible{outline:3px solid var(--charcoal);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #e4e4e7}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;max-width:900px;margin:0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;scroll-snap-align:start;border:2px solid #4a4a4a;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:44px}
  .tab[aria-pressed="true"]{background:var(--gold);color:var(--charcoal);border-color:var(--gold)}
  .tab-door{border-color:var(--red);color:var(--red)}
  .tab.tab-door[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}

  main{padding:16px 12px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border-radius:16px;border:1px solid #e4e4e7;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .card .ph{aspect-ratio:1/1;background:var(--sand);overflow:hidden}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .card .info{padding:10px 12px 14px}
  .card .nm{font-weight:700;font-size:14px;line-height:1.25;color:var(--ink)}
  .card .ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
  .card .pr{font-weight:900;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
  .card .pr small{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--charcoal);background:var(--gold);padding:3px 6px;border-radius:4px;vertical-align:middle;transform:translateY(-3px)}
  .card .pp{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:2px}
  .card .pp span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
  .card .pp b{display:block;font-weight:900;font-size:26px;line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
  .card .bd{display:inline-block;margin-top:6px;background:var(--gold);color:var(--charcoal);font-weight:900;font-size:14px;line-height:1.25;padding:8px 10px;border-radius:8px;text-transform:uppercase}
  .card .tm{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35;font-weight:600}
  .card.door{border:2px solid var(--red)}
  .card.door .pr small{background:var(--red);color:#fff}
  .card .tap{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
  .note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:18px 12px 4px}

  footer{margin-top:18px;background:var(--charcoal);color:#f3f3f3;padding:16px 12px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12px}
  footer .ft{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--gold);margin-bottom:8px}
  .strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0}
  .st{padding:2px 10px;border-left:1px solid rgba(255,255,255,.24);line-height:1.35}
  .st:first-child{border-left:0}
  .st b{display:block;font-weight:700;color:#fff}
  .st a{text-decoration:none}
  .st .ad{color:#f3f3f3;display:block}
  .st .ph2{color:var(--gold);font-weight:700;display:block;margin-top:1px;text-decoration:underline;text-underline-offset:2px}
  footer .ca{margin-top:10px;color:#e8e8e8}
  footer .fn{margin-top:4px;color:#cfcfcf}

  .lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,8,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:calc(100dvh - 130px);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pan-y}
  .lb .cap{color:#fff;font-weight:700;margin-top:12px;text-align:center;font-size:16px;line-height:1.35;max-width:min(36em,calc(100% - 8px));padding:8px 14px;background:rgba(8,8,8,.88);border-radius:10px}
  .lb button{position:absolute;border:2px solid #fff;background:rgba(20,20,20,.78);color:#fff;font:inherit;font-weight:800;cursor:pointer;border-radius:999px;width:48px;height:48px;font-size:22px}
  .lb .x{top:calc(10px + env(safe-area-inset-top));right:12px}
  .lb .pv{left:8px;top:50%;margin-top:-24px}
  .lb .nx{right:8px;top:50%;margin-top:-24px}

  @media (hover:hover){
    .card:hover{box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.1)}
  }
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}main{padding:22px 16px 8px}.card .nm{font-size:15px}header .tag{font-size:18px}.fin{flex-direction:row;justify-content:center;gap:16px}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  var d = JSON.parse(document.getElementById('flyer-data').textContent);
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var house = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16 16 5l11 11"/><path d="M9 14v13h14V14"/></svg>';
  var cats = ['All'].concat(d.categories||[]);
  var cur = 'All';

  var h = '<header><div class="brand">'+house+esc(d.businessName)+'</div><h1>'+esc(d.title)+'</h1>' +
    (d.tagline?'<p class="tag">'+esc(d.tagline)+'</p>':'') +
    (d.dates?'<div class="dates">'+esc(d.dates)+'</div>':'') + '</header>';
  h += '<div class="fin"><span class="fin-copy">'+esc(d.financing)+'</span><a class="apply" href="https://www.synchrony.com/mmc/II238036901?sitecode=acewel402" target="_blank" rel="noopener noreferrer">Apply Now<span class="sr">, opens Synchrony financing in a new tab</span></a></div>';
  h += '<nav><div class="tabs" id="tabs">' + cats.map(function(c){
        return '<button class="tab'+(c==='Door Busters'?' tab-door':'')+'" data-c="'+esc(c)+'" aria-pressed="'+(c==='All')+'">'+esc(c)+'</button>';}).join('') + '</div></nav>';
  h += '<div class="wrap"><main><div class="grid" id="grid"></div><p class="note">'+esc(d.footnote)+'</p></main></div>';
  h += '<footer><div class="wrap"><div class="ft">'+esc(d.storesHeading)+'</div><div class="strip">' + d.stores.map(function(s){
        var a = s.street+', '+s.city+', '+s.state+(s.zip?' '+s.zip:'');
        var q = encodeURIComponent('Ashley '+a);
        return '<div class="st"><b>'+esc(s.name)+'</b><a class="ad" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">'+esc(s.street)+'<br>'+esc(s.city)+', '+esc(s.state)+(s.zip?' '+esc(s.zip):'')+'</a>' +
               (s.phone?'<a class="ph2" href="tel:'+esc(s.phone.replace(/[^+\d]/g,''))+'">'+esc(s.phone)+'</a>':'')+'</div>';}).join('') +
        '</div>' + (d.callAhead?'<div class="ca">'+esc(d.callAhead)+'</div>':'') + '<div class="fn">'+esc(d.financing)+'</div></div></footer>';
  document.getElementById('app').innerHTML = h;

  var grid = document.getElementById('grid');
  var shown = [];
  function render(){
    shown = d.offers.filter(function(o){return cur==='All'||o.category===cur});
    grid.innerHTML = shown.map(function(o,i){
      var money = o.price || (o.prices?o.prices.map(function(p){return p.label+' '+p.price}).join(' / '):'') || o.badge || '';
      var sub = (o.desc && o.desc !== o.name) ? o.desc : '';
      var alt = [o.name, sub, money, o.terms].filter(Boolean).join('. ');
      return '<button class="card'+(o.category==='Door Busters'?' door':'')+'" data-i="'+i+'"><div class="ph"><img src="'+esc(o.image)+'" alt="'+esc(alt)+'" '+(i<4?'':'loading="lazy"')+' decoding="async"></div>' +
             '<div class="info"><div class="nm">'+esc(o.name)+'</div>'+(sub?'<div class="ds">'+esc(sub)+'</div>':'')+(o.prices?'<div class="pp">'+o.prices.map(function(p){return '<div><span>'+esc(p.label)+'</span><b>'+esc(p.price)+'</b></div>'}).join('')+'</div>':o.price?'<div class="pr">'+esc(o.price)+'<small>SALE</small></div>':'<div class="bd">'+esc(o.badge||'')+'</div>')+(o.terms?'<div class="tm">'+esc(o.terms)+'</div>':'')+'<div class="tap">'+(o.price||o.prices?'Tap to enlarge':'See store for details*')+'</div></div></button>';
    }).join('');
  }
  render();
  document.getElementById('tabs').addEventListener('click',function(e){
    var b = e.target.closest('.tab'); if(!b) return;
    cur = b.getAttribute('data-c');
    [].forEach.call(document.querySelectorAll('.tab'),function(t){t.setAttribute('aria-pressed', t===b)});
    render();
    var top = document.querySelector('nav').offsetTop + document.querySelector('nav').offsetHeight;
    if(window.scrollY > top) window.scrollTo({top:top-1});
  });

  var lb=document.getElementById('lb'), lbi=document.getElementById('lbi'), lbc=document.getElementById('lbc'), idx=0;
  function show(i){ idx=(i+shown.length)%shown.length; var o=shown[idx]; var sub=(o.desc && o.desc!==o.name)?o.desc:''; lbi.src=o.large||o.image; lbi.alt=o.name+(sub?' '+sub:''); lbc.textContent=o.name+(sub?' — '+sub:'')+' — '+(o.price||(o.prices?o.prices.map(function(p){return p.label+' '+p.price}).join(' / '):'')||o.badge||''); }
  function open(i){ show(i); lb.classList.add('on'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('on'); document.body.style.overflow=''; lbi.removeAttribute('src'); }
  grid.addEventListener('click',function(e){ var c=e.target.closest('.card'); if(c) open(+c.getAttribute('data-i')); });
  document.getElementById('lbx').onclick=close;
  document.getElementById('lbp').onclick=function(){show(idx-1)};
  document.getElementById('lbn').onclick=function(){show(idx+1)};
  lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown',function(e){ if(!lb.classList.contains('on'))return; if(e.key==='Escape')close(); if(e.key==='ArrowLeft')show(idx-1); if(e.key==='ArrowRight')show(idx+1); });
  var sx=null; lbi.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lbi.addEventListener('touchend',function(e){ if(sx==null)return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) show(idx+(dx<0?1:-1)); sx=null; });
  document.title = d.businessName + ' – ' + d.title;
})();
</script>
</body>
</html>
