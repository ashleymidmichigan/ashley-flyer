<!DOCTYPE html>

<head>

<title>Ashley Mid-Michigan – Fall Savings</title>
<meta name="description" content="Fall Savings at Ashley Mid-Michigan. Browse this season's promotions.">
<meta name="theme-color" content="#6e2a10">

<!-- =====================================================================
  EDIT HERE — all the content of the page comes from this one block.
  • To change a promotion: edit its name / price / category / image.
  • To add one: copy a line, put the new picture in the img/ folder.
    "image" = picture on the card, "large" = bigger version when tapped
    (leave "large" out to reuse "image").
  • "category" must match one of the names in "categories".
  • Several sizes? Use "prices": [ {"label":"Queen","price":"$749"}, ... ] instead of "price".
  • No price? Leave "price" out and add "badge": "your text" instead.
  • Sale dates: type them into "dates" (e.g. "Oct 1 – Oct 31"); leave "" to hide.
  • Leave a store "phone" as "" to hide its call link.
  Keep the commas and quotes exactly as they are.
  ===================================================================== -->

<style>
  :root{--ink:#2f2a26;--muted:#6f655c;--cream:#fbf5ec;--sand:#f3e6d2;--orange:#e8761b;--rust:#b8481a;--deep:#6e2a10;--gold:#f2b04a;
        --shadow:0 4px 18px rgba(90,45,15,.12),0 1px 3px rgba(90,45,15,.08)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.45}
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto}

  header{position:relative;overflow:hidden;color:#fff;text-align:center;padding:30px 20px 26px;
    background:radial-gradient(120% 100% at 90% 0%,#f08a2c 0%,rgba(240,138,44,0) 55%),linear-gradient(160deg,#8a3412,#5e220d)}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .brand svg{width:22px;height:22px}
  h1{margin:10px 0 0;font-weight:900;font-size:clamp(44px,13vw,76px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
  header .tag{margin:10px 0 0;font-weight:600;font-size:18px;opacity:.95}
  .dates{display:inline-block;margin-top:14px;padding:7px 16px;border:1.5px dashed rgba(255,255,255,.65);border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08)}
  .fin{background:var(--gold);color:var(--deep);text-align:center;font-weight:800;font-size:14px;padding:11px 16px}

  nav{position:sticky;top:0;z-index:20;background:rgba(251,245,236,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.07)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:900px;margin:0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:2px solid var(--rust);background:#fff;color:var(--rust);font:inherit;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:42px}
  .tab[aria-pressed="true"]{background:var(--rust);color:#fff}

  main{padding:16px 12px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;padding:0;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .card .ph{aspect-ratio:1/1;background:var(--sand);overflow:hidden}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .card .info{padding:10px 12px 14px}
  .card .nm{font-weight:700;font-size:14px;line-height:1.25;min-height:2.5em}
  .card .pr{font-weight:900;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin-top:2px}
  .card .pr small{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.14em;color:#fff;background:var(--orange);padding:3px 6px;border-radius:4px;vertical-align:middle;transform:translateY(-3px)}
  .card .pp{display:flex;gap:14px;margin-top:2px}
  .card .pp span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rust)}
  .card .pp b{display:block;font-weight:900;font-size:26px;line-height:1.1;letter-spacing:-.02em}
  .card .bd{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:14px;line-height:1.2;padding:8px 10px;border-radius:8px;text-transform:uppercase}
  .card .tap{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
  .note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:18px 12px 4px}

  footer{margin-top:20px;background:var(--deep);color:#f6e7d6;padding:20px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px}
  footer .ft{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:10px}
  .strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 0}
  .st{padding:0 10px;border-left:1px solid rgba(255,255,255,.28);line-height:1.35}
  .st:first-child{border-left:0}
  .st b{display:block;font-weight:700}
  .st a{text-decoration:none}
  .st .ad{color:#f6e7d6;display:block}
  .st .ph2{color:var(--gold);font-weight:700;display:block;margin-top:1px}
  footer .ca{margin-top:12px;opacity:.9}
  footer .fn{margin-top:4px;opacity:.7}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(20,10,5,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:calc(100dvh - 130px);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pan-y}
  .lb .cap{color:#fff;font-weight:700;margin-top:12px;text-align:center;font-size:16px}
  .lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:800;cursor:pointer;border-radius:999px;width:48px;height:48px;font-size:22px}
  .lb .x{top:calc(10px + env(safe-area-inset-top));right:12px}
  .lb .pv{left:8px;top:50%;margin-top:-24px}
  .lb .nx{right:8px;top:50%;margin-top:-24px}

  @media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}main{padding:22px 16px 8px}.card .nm{font-size:15px}}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">Please turn on JavaScript to see this page.</p></noscript></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Promotion photo">
  <button class="x" id="lbx" aria-label="Close">✕</button>
  <button class="pv" id="lbp" aria-label="Previous">‹</button>
  <img id="lbi" alt="">
  <div class="cap" id="lbc"></div>
  <button class="nx" id="lbn" aria-label="Next">›</button>
</div>

<script>
(function(){
  var d = JSON.parse(document.getElementById('flyer-data').textContent);
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var house = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16 16 5l11 11"/><path d="M9 14v13h14V14"/></svg>';
  var cats = ['All'].concat(d.categories||[]);
  var cur = 'All';

  var h = '<header><div class="brand">'+house+esc(d.businessName)+'</div><h1>'+esc(d.title)+'</h1>' +
    (d.tagline?'<p class="tag">'+esc(d.tagline)+'</p>':'') +
    (d.dates?'<div class="dates">'+esc(d.dates)+'</div>':'') + '</header>';
  h += '<div class="fin">'+esc(d.financing)+'</div>';
  h += '<nav><div class="tabs" id="tabs">' + cats.map(function(c){
        return '<button class="tab" data-c="'+esc(c)+'" aria-pressed="'+(c==='All')+'">'+esc(c)+'</button>';}).join('') + '</div></nav>';
  h += '<div class="wrap"><main><div class="grid" id="grid"></div><p class="note">'+esc(d.footnote)+'</p></main></div>';
  h += '<footer><div class="wrap"><div class="ft">'+esc(d.storesHeading)+'</div><div class="strip">' + d.stores.map(function(s){
        var a = s.street+', '+s.city+', '+s.state+(s.zip?' '+s.zip:'');
        var q = encodeURIComponent('Ashley '+a);
        return '<div class="st"><b>'+esc(s.name)+'</b><a class="ad" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">'+esc(s.street)+'<br>'+esc(s.city)+', '+esc(s.state)+(s.zip?' '+esc(s.zip):'')+'</a>' +
               (s.phone?'<a class="ph2" href="tel:'+esc(s.phone.replace(/[^+\d]/g,''))+'">'+esc(s.phone)+'</a>':'')+'</div>';}).join('') +
        '</div>' + (d.callAhead?'<div class="ca">'+esc(d.callAhead)+'</div>':'') + '<div class="fn">'+esc(d.financing)+'</div></div></footer>';
  document.getElementById('app').innerHTML = h;

  var grid = document.getElementById('grid');
  var shown = [];
  function render(){
    shown = d.offers.filter(function(o){return cur==='All'||o.category===cur});
    grid.innerHTML = shown.map(function(o,i){
      return '<button class="card" data-i="'+i+'"><div class="ph"><img src="'+esc(o.image)+'" alt="'+esc(o.name)+' '+esc(o.price||(o.prices?o.prices.map(function(p){return p.label+' '+p.price}).join(' / '):'')||o.badge||'')+'" '+(i<4?'':'loading="lazy"')+' decoding="async"></div>' +
             '<div class="info"><div class="nm">'+esc(o.name)+'</div>'+(o.prices?'<div class="pp">'+o.prices.map(function(p){return '<div><span>'+esc(p.label)+'</span><b>'+esc(p.price)+'</b></div>'}).join('')+'</div>':o.price?'<div class="pr">'+esc(o.price)+'<small>SALE</small></div>':'<div class="bd">'+esc(o.badge||'')+'</div>')+'<div class="tap">'+(o.price||o.prices?'Tap to enlarge':'See store for details*')+'</div></div></button>';
    }).join('');
  }
  render();
  document.getElementById('tabs').addEventListener('click',function(e){
    var b = e.target.closest('.tab'); if(!b) return;
    cur = b.getAttribute('data-c');
    [].forEach.call(document.querySelectorAll('.tab'),function(t){t.setAttribute('aria-pressed', t===b)});
    render();
    var top = document.querySelector('nav').offsetTop + document.querySelector('nav').offsetHeight;
    if(window.scrollY > top) window.scrollTo({top:top-1});
  });

  var lb=document.getElementById('lb'), lbi=document.getElementById('lbi'), lbc=document.getElementById('lbc'), idx=0;
  function show(i){ idx=(i+shown.length)%shown.length; var o=shown[idx]; lbi.src=o.large||o.image; lbi.alt=o.name; lbc.textContent=o.name+' — '+(o.price||(o.prices?o.prices.map(function(p){return p.label+' '+p.price}).join(' / '):'')||o.badge||''); }
  function open(i){ show(i); lb.classList.add('on'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('on'); document.body.style.overflow=''; lbi.removeAttribute('src'); }
  grid.addEventListener('click',function(e){ var c=e.target.closest('.card'); if(c) open(+c.getAttribute('data-i')); });
  document.getElementById('lbx').onclick=close;
  document.getElementById('lbp').onclick=function(){show(idx-1)};
  document.getElementById('lbn').onclick=function(){show(idx+1)};
  lb.addEventListener('click',function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown',function(e){ if(!lb.classList.contains('on'))return; if(e.key==='Escape')close(); if(e.key==='ArrowLeft')show(idx-1); if(e.key==='ArrowRight')show(idx+1); });
  var sx=null; lbi.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lbi.addEventListener('touchend',function(e){ if(sx==null)return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) show(idx+(dx<0?1:-1)); sx=null; });
  document.title = d.businessName + ' – ' + d.title;
})();
</script>
</body>
</html>
